name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio black flake8 bandit httpx

    - name: Run Black Formatter Check
      run: |
        black --check ui/ api/ pipeline/ data/ tests/ --exclude "(app_original_backup.py)" || true

    - name: Run Flake8 Linter Check
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 ui/ api/ pipeline/ data/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=app_original_backup.py
        # exit-zero treats all errors as warnings
        flake8 ui/ api/ pipeline/ data/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=app_original_backup.py

    - name: Run Security Scan (Bandit)
      run: |
        bandit -r api/ pipeline/ data/ --exit-zero

    - name: Run Test Suite (Pytest)
      run: |
        pytest tests/ -v
