name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install CI Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pydantic requests python-dotenv pytest pytest-asyncio httpx flake8 bandit python-multipart langgraph==0.2.14 langchain-core==0.2.43

    - name: Run Flake8 Syntax Check (API & Pipeline only)
      run: |
        flake8 api/ pipeline/ data/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Security Audit (Bandit)
      run: |
        bandit -r api/ pipeline/ data/ --exit-zero -q

    - name: Run Pytest Test Suite (70 Tests)
      env:
        PYTHONPATH: .
      run: |
        pytest tests/ -v --tb=short