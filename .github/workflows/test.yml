name: VendorMind AI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest sentence-transformers pydantic pyjwt fastapi streamlit pandas pytest-cov

    - name: Run Pytest Suite
      run: |
        pytest tests/ -v
